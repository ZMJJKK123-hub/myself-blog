# Self-hosted deployment example. Replace domain/root and manage TLS outside this example.
server {
    listen 80;
    server_name blog.example.com;
    root /path/to/myself-blog/site;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ { proxy_pass http://127.0.0.1:3000; }
    location /media/ { proxy_pass http://127.0.0.1:3000; }
    location = /feed.xml { proxy_pass http://127.0.0.1:3000; }
    location = / { try_files /index/index.html =404; }
    location ~ ^/(projects|notes)/[a-z][a-z0-9-]*/?$ {
        try_files /$1/detail.html =404;
    }
    location ~ \.(ts|json|md)$ { return 404; }
    location / { try_files $uri $uri/index.html =404; }
    error_page 404 /not-found/index.html;
}
